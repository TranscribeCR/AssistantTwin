name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required Android packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;26.3.11579264"

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Ensure llama.cpp is available
        run: |
          if [ ! -d "app/src/main/cpp/llama.cpp" ]; then
            git clone --depth 1 https://github.com/ggml-org/llama.cpp.git \
              app/src/main/cpp/llama.cpp
          fi

          test -f app/src/main/cpp/llama.cpp/CMakeLists.txt

      - name: Verify native source
        run: |
          echo "llama.cpp directory:"
          ls -la app/src/main/cpp/llama.cpp
          echo "CMakeLists:"
          test -f app/src/main/cpp/llama.cpp/CMakeLists.txt

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssistantTwin-debug-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
